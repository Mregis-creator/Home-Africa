    html, body {

    #particles-js {

    .particles-js-canvas-el {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;

      margin: 0 !important;

    /* Splash Screen Styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10001;

      justify-content: center;
      flex-direction: column;
      transition: opacity 0.7s;
      animation: splashFadeIn 1.2s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes splashFadeIn {
      0% { opacity: 0; transform: scale(1.08) translateY(40px); }
      60% { opacity: 1; transform: scale(1.01) translateY(-10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    #splash-screen img {
      max-width: 40vw;
      max-height: 40vh;
      border-radius: 50%;
      box-shadow: 0 0 60px #0ff, 0 0 120px #8fff00;
      opacity: 0;
      transform: scale(0.7) rotate(-10deg);
      animation: logoPopIn 2.2s 3.3s cubic-bezier(0.4,0,0.4,1) forwards;
    }
    @keyframes logoPopIn {
      0% { opacity: 0; transform: scale(0.7) rotate(-10deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(6deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    #splash-screen h1 {
      margin-top: 2rem;
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(90deg, #0ff 10%, #8fff00 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.2em;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: textSlideIn 1.1s 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    #splash-screen h2 {
      color: #fff;
      margin-top: 1.5rem;
      opacity: 0;
      transform: translateY(30px);
      animation: textSlideIn 1s 1.1s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes textSlideIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .navbar {
      background: linear-gradient(90deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 100%) !important;
      border-bottom: 2px solid #0ff;

    .navbar .container {

    .navbar-brand {

      gap: 10px;

      background: linear-gradient(90deg, #0ff 10%, #8fff00 90%);

      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .navbar-brand img {
      height: 50px;
      border-radius: 12px;
      animation: glow-pulse 2s infinite;
      box-shadow: 0 0 12px #0ff, 0 0 24px #0ff;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s;
    }

    .navbar-brand img:hover {
      transform: scale(1.05) rotate(2deg);
      box-shadow: 0 0 18px #0ff, 0 0 36px #0ff;
    }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
      50% { box-shadow: 0 0 18px #0ff, 0 0 36px #0ff; }
    }

    .booking-form {

      padding: 2rem;

      max-width: 700px;

      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);

    .booking-form label {
      color: #ddd;
    }

    .form-control {
      border-radius: 8px;
    }

    .form-control:focus {
      border-color: #0ff;
      box-shadow: 0 0 0 0.2rem rgba(0,255,136,0.25);
    }

    .vibrant-btn {
      background: linear-gradient(90deg, #0ff 0%, #8fff00 100%);
      color: #222;
      border: none;
      font-weight: bold;
      box-shadow: 0 2px 8px 0 rgba(0,255,136,0.15);
      transition: background 0.3s, color 0.3s;
      text-shadow: 1px 2px 8px #fff, 0 1px 0 #0ff;
      position: relative;
      z-index: 1;
    }

    .vibrant-btn:hover, .vibrant-btn:focus {
      background: linear-gradient(90deg, #8fff00 0%, #0ff 100%);
      color: #111;
    }

    .decorated-btn {
      border: 2.5px solid transparent;
      border-radius: 10px;
      background-image: linear-gradient(90deg, #0ff 0%, #8fff00 100%), linear-gradient(120deg, #fff, #0ff, #8fff00, #fff 90%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 16px 0 rgba(0,255,136,0.18);
    }

    /* Unified Footer Styles - Responsive */

      border-top: 2px solid #0ff;
      box-shadow: 0 -2px 12px rgba(0,255,136,0.08);
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }
    .footer-link {
      color: #fff !important;
      transition: color 0.2s;
    }
    .footer-link:hover {
      color: #FFD600 !important;
      text-decoration: underline;
    }
    /* Add padding to body to prevent content from being hidden behind fixed footer */
    body {
      padding-bottom: 250px;
    }
    @media (max-width: 768px) {
      footer.bg-dark {
        position: relative;
      }
      body {
        padding-bottom: 0;
      }
      footer.bg-dark .row > div {
        margin-bottom: 1.5rem;
      }
    }

      footer.bg-dark .container {
        max-width: 1200px;
      }
    }

    .bi {
      color: #0ff;
      font-size: 1.3rem;
      transition: color 0.2s, text-shadow 0.2s;
      text-shadow: 0 0 8px #8fff00;
    }

    .bi:hover {
      color: #8fff00;

    }

    @media (max-width: 576px) {

        font-size: 1.1rem;
      }

      .booking-form {
        margin: 60px 0 0 0;
        padding: 1rem;
      }
    }
  </style>

  <!-- 📄 Booking Form -->
  <div class="container">
    <div class="booking-form">
      <h2>Book a Driving Lesson</h2>
      <div id="bookingStatus" class="mb-3" style="display:none;" role="alert"></div>
      <form id="lessonBookingForm" novalidate>
        <div class="mb-3">
          <label for="name">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="e.g. Regis Muhakwa" required />
        </div>
        <div class="mb-3">
          <label for="email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="e.g. regis@home.africa" required />
        </div>
        <div class="mb-3">
          <label for="phone">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="e.g. +250 78 3962518" required />
        </div>
        <div class="mb-3">
          <label for="package">Select a Package</label>
          <select class="form-control" id="package" required>
            <option value="">-- Choose Package --</option>
            <option>Beginner Package - 10 Lessons</option>
            <option>Intermediate Package - 7 Lessons</option>
            <option>Advanced Package - 5 Lessons</option>
            <option>Refresher Course - 3 Lessons</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="schedule">Preferred Schedule</label>
          <select class="form-control" id="schedule" required>
            <option>Morning (8 AM - 11 AM)</option>
            <option>Afternoon (1 PM - 4 PM)</option>
            <option>Evening (5 PM - 7 PM)</option>
            <option>Weekend Only</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="message">Message / Notes</label>
          <textarea class="form-control" id="message" rows="3" placeholder="Any special request?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary vibrant-btn decorated-btn" id="bookingSubmitBtn">Confirm Booking</button>

  <!-- 💫 Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: "#0ff" },
        shape: { type: "circle" },
        opacity: { value: 0.3 },
        size: { value: 3 },
        move: { enable: true, speed: 1 }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });

    // Hide splash screen immediately (splash only on index page)

  <!-- Booking form submit handler -->
  <script>
    (function () {
      const form = document.getElementById('lessonBookingForm');
      if (!form) return;

      const statusBox = document.getElementById('bookingStatus');
      const submitBtn = document.getElementById('bookingSubmitBtn');

      function showStatus(type, html) {
        statusBox.className = 'mb-3 alert alert-' + type;
        statusBox.style.display = 'block';
        statusBox.innerHTML = html;
        statusBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // --- Validate ---
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const pkg = document.getElementById('package').value.trim();
        const schedule = document.getElementById('schedule').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!name || name.length < 2) { showStatus('warning', 'Please enter your full name.'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStatus('warning', 'Please enter a valid email address.'); return; }
        if (!phone || phone.replace(/\D/g, '').length < 7) { showStatus('warning', 'Please enter a valid phone number.'); return; }
        if (!pkg) { showStatus('warning', 'Please select a lesson package.'); return; }
        if (!schedule) { showStatus('warning', 'Please select a preferred schedule.'); return; }

        // Extract lesson count from package label, e.g. "Beginner Package - 10 Lessons"
        const lessonsMatch = pkg.match(/(\d+)\s*Lessons?/i);
        const lessons = lessonsMatch ? parseInt(lessonsMatch[1], 10) : null;

        const originalBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
          const client = (typeof window.getSupabaseClient === 'function' ? window.getSupabaseClient() : null) || window.supabaseClient;
          if (!client) throw new Error('Supabase client not available');

          // Attach the logged-in user if there is one (booking works for guests too)
          let userId = null;
          try {
            const { data: { session } } = await client.auth.getSession();
            userId = session && session.user ? session.user.id : null;
          } catch (authErr) {
            console.warn('Could not read auth session for booking:', authErr);
          }

          const record = {
            booking_type: 'driving_lesson',
            contact_name: name,
            contact_email: email,
            contact_phone: phone,
            notes: 'Package: ' + pkg +
                   (lessons ? ' (' + lessons + ' lessons)' : '') +
                   ' | Preferred schedule: ' + schedule +
                   (message ? ' | Notes: ' + message : ''),
            status: 'pending',
            created_at: new Date().toISOString()
          };
          if (userId) record.user_id = userId;

          const { error } = await client.from('bookings').insert([record]);
          if (error) throw error;

          form.reset();
          form.style.display = 'none';
          showStatus('success',
            '<strong>Booking received!</strong> Thank you, ' +
            name.replace(/[&<>"']/g, '') +
            '. Your request for the <em>' + pkg.replace(/[&<>"']/g, '') +
            '</em> is pending confirmation — we will contact you at ' +
            phone.replace(/[&<>"']/g, '') + '.');
        } catch (err) {
          console.warn('Booking submission failed (bookings table may not be set up yet):', err);
          showStatus('danger',
            '<strong>Sorry, we could not submit your booking right now.</strong><br>' +
            'Please try again in a few minutes, or contact us directly and we will book you in manually.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        }
      });
    })();
  </script>
