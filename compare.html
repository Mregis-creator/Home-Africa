<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Listings - HOME AFRICA</title>
  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    html, body {
      font-family: 'Segoe UI', sans-serif;
      background: url('images/hero-bg.jpeg') center center/cover no-repeat;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: linear-gradient(120deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 50%, rgba(255,0,136,0.18) 100%);
      pointer-events: none;
    }
    .navbar {
      background: linear-gradient(90deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 100%) !important;
      border-bottom: 2px solid #0ff;
    }
    .navbar-brand {
      font-weight: bold;
      color: white !important;
      background: linear-gradient(90deg, #0ff 10%, #8fff00 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-link {
      color: rgba(255,255,255,0.9) !important;
    }
    .compare-container {
      position: relative;
      z-index: 1;
      padding-top: 2rem;
      padding-bottom: 4rem;
    }
    .compare-card {
      background: rgba(0,0,0,0.8);
      border: 2px solid #0ff;
      border-radius: 16px;
      padding: 1.5rem;
      height: 100%;
      transition: all 0.3s;
    }
    .compare-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0,255,136,0.2);
    }
    .compare-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1rem;
    }
    .compare-label {
      color: #8fff00;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .compare-value {
      color: white;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .remove-compare-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,68,68,0.9);
      border: none;
      color: white;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      z-index: 10;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(0,0,0,0.8);
      border: 2px dashed #0ff;
      border-radius: 16px;
    }
    .empty-state i {
      font-size: 4rem;
      color: #0ff;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      color: white;
      margin-bottom: 1rem;
    }
    .empty-state p {
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/hero-bg.jpeg" alt="Logo" style="height: 40px; border-radius: 8px; margin-right: 10px;" />
        HOME AFRICA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="apartment.html">Apartments</a></li>
          <li class="nav-item"><a class="nav-link" href="cars.html">Cars</a></li>
          <li class="nav-item"><a class="nav-link" href="land.html">Land</a></li>
          <li class="nav-item"><a class="nav-link" href="favorites.html"><i class="bi bi-heart"></i> Favorites</a></li>
          <li class="nav-item"><a class="nav-link active" href="compare.html"><i class="bi bi-columns"></i> Compare</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Compare Container -->
  <div class="container compare-container">
    <h1 class="text-white mb-4 text-center"><i class="bi bi-columns"></i> Compare Listings</h1>
    
    <div id="compareContent">
      <!-- Listings will be loaded here -->
    </div>

    <div class="text-center mt-4">
      <button id="clearCompareBtn" class="btn btn-danger" style="display:none;">
        <i class="bi bi-trash"></i> Clear All
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/compare-listings.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadCompareListings();
    });

    function loadCompareListings() {
      var list = window.HomeAfricaCompare.getCompareList();
      var container = document.getElementById('compareContent');
      var clearBtn = document.getElementById('clearCompareBtn');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-columns"></i>
            <h3>No Listings to Compare</h3>
            <p>Add listings to compare by clicking the compare button on any listing card.</p>
            <a href="index.html" class="btn btn-primary mt-3" style="background: linear-gradient(90deg, #0ff 0%, #8fff00 100%); border: none;">
              Browse Listings
            </a>
          </div>
        `;
        clearBtn.style.display = 'none';
        return;
      }

      clearBtn.style.display = 'inline-block';

      var html = '<div class="row">';
      list.forEach(function(listing) {
        html += `
          <div class="col-md-${12 / list.length} mb-4">
            <div class="compare-card position-relative">
              <button class="remove-compare-btn" onclick="removeFromCompare('${listing.id}', '${listing.type}')">
                <i class="bi bi-x"></i>
              </button>
              <img src="${listing.image || 'images/hero-bg.jpeg'}" class="compare-image" alt="${listing.title}">
              <h4 class="text-white mb-3">${listing.title}</h4>
              
              <div class="compare-label">Price</div>
              <div class="compare-value">${listing.price}</div>
              
              <div class="compare-label">Location</div>
              <div class="compare-value">${listing.location}</div>
              
              <div class="compare-label">Type</div>
              <div class="compare-value">${listing.type.charAt(0).toUpperCase() + listing.type.slice(1)}</div>
              
              <div class="compare-label">Status</div>
              <div class="compare-value">${listing.status}</div>
              
              ${listing.rooms ? `
                <div class="compare-label">Rooms</div>
                <div class="compare-value">${listing.rooms}</div>
              ` : ''}
              
              ${listing.area ? `
                <div class="compare-label">Area</div>
                <div class="compare-value">${listing.area}</div>
              ` : ''}
              
              <a href="${listing.type}-detail.html?id=${listing.id}" class="btn btn-primary w-100 mt-3" style="background: linear-gradient(90deg, #0ff 0%, #8fff00 100%); border: none;">
                View Details
              </a>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function removeFromCompare(listingId, listingType) {
      window.HomeAfricaCompare.removeFromCompare(listingId, listingType);
      window.HomeAfricaCompare.updateCompareCount();
      loadCompareListings();
    }

    document.getElementById('clearCompareBtn').addEventListener('click', function() {
      if (confirm('Are you sure you want to clear all listings from compare?')) {
        window.HomeAfricaCompare.clearCompare();
        window.HomeAfricaCompare.updateCompareCount();
        loadCompareListings();
      }
    });
  </script>
</body>
</html>
