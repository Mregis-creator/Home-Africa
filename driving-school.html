<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driving School | HOME AFRICA</title>
  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link rel="apple-touch-icon" href="homeafricabanneralternative_III.png" />
  <meta name="description" content="HOME AFRICA Driving School — Professional driving lessons in Rwanda. Certified instructors, flexible schedules, and exam preparation." />

  <!-- Offline Bootstrap CSS -->
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('images/hero-bg.jpeg') center center/cover no-repeat;
      color: white;
      overflow-x: hidden;
    }
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      z-index: -1;
      pointer-events: none;
      display: block;
    }
    .navbar {
      background: linear-gradient(90deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 100%) !important;
      border-bottom: 2px solid #0ff;
      box-shadow: 0 2px 12px rgba(0,255,136,0.08);
    }
    .navbar .container {
      padding-top: 0.4rem;
      padding-bottom: 0.4rem;
    }
    .navbar-brand {
      font-weight: bold;
      color: white !important;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      background: linear-gradient(90deg, #0ff 10%, #8fff00 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .navbar-brand img {
      height: 50px;
      border-radius: 12px;
      animation: glow-pulse 2s infinite;
      box-shadow: 0 0 12px #0ff, 0 0 24px #0ff;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s;
    }
    .navbar-brand img:hover {
      transform: scale(1.05) rotate(2deg);
      box-shadow: 0 0 18px #0ff, 0 0 36px #0ff;
    }
    .navbar .nav-link, .navbar .navbar-brand {
      color: #fff !important;
      transition: color 0.2s;
    }
    .navbar .nav-link:hover, .navbar .navbar-brand:hover {
      color: #FFD600 !important;
      text-decoration: underline;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
      50% { box-shadow: 0 0 18px #0ff, 0 0 36px #0ff; }
    }
    .driving-landing {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .driving-landing h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #FFD600 30%, #FFEA70 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
      animation: fadeInHero 1.2s cubic-bezier(0.4,0,0.2,1) 0.2s both;
      text-shadow: 2px 4px 16px #FFD600, 0 2px 0 #003366;
    }
    @keyframes fadeInHero {
      0% { opacity: 0; transform: translateY(40px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .driving-landing p {
      font-size: 1.2rem;
      color: #e0f7fa;
      margin-bottom: 2.2rem;
      text-shadow: 1px 2px 8px #003366, 0 1px 0 #0ff;
    }
    .choice-btns {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
    }
    .choice-btn {
      min-width: 320px;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 1.1rem 2.2rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #0ff 0%, #8fff00 100%);
      color: #003366;
      box-shadow: 0 2px 16px 0 rgba(0,255,136,0.18);
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      text-shadow: 1px 2px 8px #fff, 0 1px 0 #0ff;
      outline: none;
    }
    .choice-btn:hover, .choice-btn:focus {
      background: linear-gradient(90deg, #8fff00 0%, #0ff 100%);
      color: #111;
      transform: scale(1.04);
    }
    .choice-btn .bi {
      font-size: 1.6rem;
      margin-right: 0.7rem;
      vertical-align: middle;
      color: #0ff;
      text-shadow: 0 0 8px #8fff00;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .choice-btn:hover .bi {
      color: #8fff00;
      text-shadow: 0 0 12px #0ff;
    }
    /* Splash Screen Styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.7s;
      animation: splashFadeIn 1.2s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes splashFadeIn {
      0% { opacity: 0; transform: scale(1.08) translateY(40px); }
      60% { opacity: 1; transform: scale(1.01) translateY(-10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    #splash-screen img {
      max-width: 40vw;
      max-height: 40vh;
      border-radius: 50%;
      box-shadow: 0 0 60px #0ff, 0 0 120px #8fff00;
      opacity: 0;
      transform: scale(0.7) rotate(-10deg);
      animation: logoPopIn 2.2s 3.3s cubic-bezier(0.4,0,0.4,1) forwards;
    }
    @keyframes logoPopIn {
      0% { opacity: 0; transform: scale(0.7) rotate(-10deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(6deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    #splash-screen h1 {
      margin-top: 2rem;
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(90deg, #0ff 10%, #8fff00 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.2em;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: textSlideIn 1.1s 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    #splash-screen h2 {
      color: #fff;
      margin-top: 1.5rem;
      opacity: 0;
      transform: translateY(30px);
      animation: textSlideIn 1s 1.1s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes textSlideIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* Unified Footer Styles - Responsive */
    footer.bg-dark {
      background: linear-gradient(90deg, #0f2027 0%, #2c5364 100%) !important;
      border-top: 2px solid #0ff;
      box-shadow: 0 -2px 12px rgba(0,255,136,0.08);
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }
    .footer-link {
      color: #fff !important;
      transition: color 0.2s;
    }
    .footer-link:hover {
      color: #FFD600 !important;
      text-decoration: underline;
    }
    /* Add padding to body to prevent content from being hidden behind fixed footer */
    body {
      padding-bottom: 250px;
    }
    @media (max-width: 768px) {
      footer.bg-dark {
        position: relative;
      }
      body {
        padding-bottom: 0;
      }
      footer.bg-dark .row > div {
        margin-bottom: 1.5rem;
      }
    }
    @media (min-width: 769px) {
      footer.bg-dark .container {
        max-width: 1200px;
      }
    }
    @media (max-width: 576px) {
      .driving-landing h1 { font-size: 1.5rem; }
      .choice-btn { min-width: 90vw; font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- 🌌 Particle Background -->
  <div id="particles-js"></div>
  
  <!-- Splash Screen Overlay -->
  <div id="splash-screen" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:10001;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.7s;">
    <div style="text-align:center;">
      <img src="images/hero-bg.jpeg" alt="HOME AFRICA" style="max-width:40vw;max-height:40vh;border-radius:50%;box-shadow:0 0 60px #0ff,0 0 120px #8fff00;">
      <h1 style="margin-top:2rem;font-size:3.5rem;font-weight:bold;background:linear-gradient(90deg,#0ff 10%,#8fff00 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.2em;">HOME AFRICA</h1>
      <h2 style="color:#fff;margin-top:1.5rem;">Beyond Horizons</h2>
    </div>
  </div>
  <div id="main-content" style="display:none;">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/hero-bg.jpeg" alt="Logo" />
        HOME AFRICA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="driving-school.html">Driving School Home</a></li>
          <li class="nav-item"><a class="nav-link" href="basic.html">Basic Package</a></li>
          <li class="nav-item"><a class="nav-link" href="standard.html">Standard Package</a></li>
          <li class="nav-item"><a class="nav-link" href="premium.html">Premium Package</a></li>
          <li class="nav-item"><a class="nav-link" href="signin.html">Log In</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="driving-landing">
    <h1>HOME AFRICA DRIVING SCHOOL</h1>
    <p>What do you want to prepare for?</p>
    <div class="choice-btns">
      <a href="basic.html" class="choice-btn d-block text-decoration-none"><i class="bi bi-clipboard-check"></i> Provisional License</a>
      <a href="standard.html" class="choice-btn d-block text-decoration-none"><i class="bi bi-award"></i> Permanent License</a>
      <a href="combined.html" class="choice-btn d-block text-decoration-none"><i class="bi bi-collection"></i> Combined License</a>
    </div>
  </main>
  <!-- 🌍 Minimal Footer -->
  <footer class="bg-dark text-light py-2 mt-5" style="border-top:2px solid #0ff;">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="small">
          &copy; <span class="footer-year">2026</span> HOME AFRICA ·
          <a href="privacy-policy.html" class="footer-link text-white">Privacy</a> ·
          <a href="terms-of-service.html" class="footer-link text-white">Terms</a>
        </div>
        <div>
          <a href="https://facebook.com/homeafrica" target="_blank" rel="noopener" aria-label="Facebook" class="text-white me-2"><i class="bi bi-facebook"></i></a>
          <a href="https://twitter.com/homeafrica" target="_blank" rel="noopener" aria-label="Twitter" class="text-white me-2"><i class="bi bi-twitter"></i></a>
          <a href="https://www.instagram.com/home_africa_?igsh=MTczYzA5OWhhcDUwdA%3D%3D&utm_source=qr" target="_blank" rel="noopener" aria-label="Instagram" class="text-white me-2"><i class="bi bi-instagram"></i></a>
          <a href="https://linkedin.com/company/homeafrica" target="_blank" rel="noopener" aria-label="LinkedIn" class="text-white"><i class="bi bi-linkedin"></i></a>
        </div>
      </div>
    </div>
    <script>document.querySelectorAll('.footer-year').forEach(function(e){e.textContent=new Date().getFullYear();});</script>
  </footer>
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: "#0ff" },
        shape: { type: "circle" },
        opacity: { value: 0.3 },
        size: { value: 3 },
        move: { enable: true, speed: 1 }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });

    // Hide splash screen immediately (splash only on index page)
    window.addEventListener('DOMContentLoaded', function() {
      const splashScreen = document.getElementById('splash-screen');
      if (splashScreen) {
        splashScreen.style.display = 'none';
      }
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        mainContent.style.display = '';
      }
    });
  </script>
  </div>
  <!-- Rejo AI Chatbot -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/nav-active.js"></script>
  <script src="js/ai-chatbot.js"></script>
  <script src="js/footer-fix.js"></script>
</body>
</html>
