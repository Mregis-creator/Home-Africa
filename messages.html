<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link rel="apple-touch-icon" href="homeafricabanneralternative_III.png" />
  <meta name="description" content="HOME AFRICA � Rwanda's trusted real estate and lifestyle platform. Browse verified apartments, land, and cars, and connect instantly with sellers." />

  <!-- Bootstrap CSS -->
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('images/hero-bg.jpeg') center center/cover no-repeat;
      overflow-x: hidden;
      padding-top: 80px;
      padding-bottom: 100px;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: linear-gradient(120deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 50%, rgba(255,0,136,0.18) 100%);
      pointer-events: none;
    }

    .navbar {
      background: linear-gradient(90deg, rgba(255,0,136,0.3) 0%, rgba(0,136,255,0.3) 100%) !important;
      border-bottom: 3px solid #ff0088;
      box-shadow: 0 2px 12px rgba(255,0,136,0.2);
      position: relative;
      z-index: 1000;
    }

    .messages-container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      height: calc(100vh - 180px);
    }

    .messages-layout {
      display: flex;
      gap: 1rem;
      height: 100%;
      background: linear-gradient(120deg, rgba(0,0,0,0.95) 60%, rgba(255,0,136,0.15) 100%);
      border: 2px solid #ff0088;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 0 24px 0 rgba(255,0,136,0.2);
    }

    /* Threads List */
    .threads-list {
      width: 350px;
      border-right: 2px solid rgba(255,0,136,0.3);
      padding-right: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .thread-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .thread-item:hover {
      border-color: #0ff;
      box-shadow: 0 4px 20px rgba(0,255,255,0.2);
    }

    .thread-item.active {
      border-color: #0ff;
      background: rgba(0,255,255,0.1);
    }

    .thread-item.unread {
      border-left: 4px solid #8fff00;
    }

    .thread-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #0ff;
      margin-right: 1rem;
    }

    .thread-info {
      flex-grow: 1;
    }

    .thread-name {
      color: #fff;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .thread-preview {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-time {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
    }

    .unread-badge {
      background: #8fff00;
      color: #111;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: auto;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      border-bottom: 2px solid rgba(255,0,136,0.3);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #0ff;
    }

    .chat-name {
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message-bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      word-wrap: break-word;
    }

    .message-bubble.sent {
      background: linear-gradient(90deg, #0ff 0%, #8fff00 100%);
      color: #111;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      background: rgba(255,255,255,0.1);
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      margin-top: 0.25rem;
    }

    .message-bubble.sent .message-time {
      color: rgba(0,0,0,0.6);
    }

    .chat-input-area {
      border-top: 2px solid rgba(255,0,136,0.3);
      padding: 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      color: #fff;
      border-radius: 24px;
      padding: 0.75rem 1.25rem;
      resize: none;
      min-height: 50px;
      max-height: 150px;
    }

    .chat-input:focus {
      background: rgba(255,255,255,0.15);
      border-color: #0ff;
      color: #fff;
      box-shadow: 0 0 0 0.2rem rgba(0,255,255,0.25);
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .btn-send {
      background: linear-gradient(90deg, #0ff 0%, #8fff00 100%);
      border: none;
      color: #111;
      font-weight: bold;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-send:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 20px rgba(0,255,255,0.4);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .messages-layout {
        flex-direction: column;
      }

      .threads-list {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid rgba(255,0,136,0.3);
        max-height: 300px;
      }

      .chat-area {
        min-height: 400px;
      }
    }

    .text-white {
      color: #fff !important;
    }

    .text-cyan {
      color: #0ff !important;
    }
  </style>
</head>
<body>
  <!-- Particles Background -->
  <div id="particles-js"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/hero-bg.jpeg" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;" />
        HOME AFRICA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="network.html">Network</a></li>
          <li class="nav-item"><a class="nav-link active" href="messages.html">Messages</a></li>
          <li class="nav-item"><a class="nav-link" href="profile-personal.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="create-post.html"><i class="bi bi-plus-circle"></i> Create Post</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Messages Container -->
  <div class="messages-container">
    <div class="messages-layout">
      <!-- Threads List -->
      <div class="threads-list">
        <h4 class="text-white mb-3">
          <i class="bi bi-chat-dots"></i> Conversations
        </h4>
        <div id="threadsList">
          <!-- Threads will be loaded here -->
          <div class="empty-state">
            <i class="bi bi-inbox"></i>
            <p>No conversations yet</p>
          </div>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area">
        <div id="chatHeader" class="chat-header" style="display: none;">
          <img src="images/hero-bg.jpeg" alt="Avatar" class="chat-avatar" id="chatAvatar" />
          <div>
            <div class="chat-name" id="chatName">Select a conversation</div>
            <small class="text-white-50" id="chatStatus">Online</small>
          </div>
        </div>

        <div id="chatMessages" class="chat-messages">
          <div class="empty-state">
            <i class="bi bi-chat-left-text"></i>
            <p>Select a conversation to start messaging</p>
          </div>
        </div>

        <div id="chatInputArea" class="chat-input-area" style="display: none;">
          <textarea 
            class="chat-input" 
            id="messageInput" 
            placeholder="Type a message..."
            rows="1"></textarea>
          <button class="btn-send" id="sendMessageBtn" onclick="sendMessage()">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🌍 Minimal Footer -->
  <footer class="bg-dark text-light py-2 mt-5" style="border-top:2px solid #0ff;">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="small">
          &copy; <span class="footer-year">2026</span> HOME AFRICA · 
          <a href="privacy-policy.html" class="footer-link text-white">Privacy</a> · 
          <a href="terms-of-service.html" class="footer-link text-white">Terms</a>
        </div>
        <div>
          <a href="https://facebook.com/homeafrica" target="_blank" rel="noopener" aria-label="Facebook" class="text-white me-2"><i class="bi bi-facebook"></i></a>
          <a href="https://twitter.com/homeafrica" target="_blank" rel="noopener" aria-label="Twitter" class="text-white me-2"><i class="bi bi-twitter"></i></a>
          <a href="https://www.instagram.com/home_africa_?igsh=MTczYzA5OWhhcDUwdA%3D%3D&utm_source=qr" target="_blank" rel="noopener" aria-label="Instagram" class="text-white me-2"><i class="bi bi-instagram"></i></a>
          <a href="https://linkedin.com/company/homeafrica" target="_blank" rel="noopener" aria-label="LinkedIn" class="text-white"><i class="bi bi-linkedin"></i></a>
        </div>
      </div>
    </div>
    <script>document.querySelectorAll('.footer-year').forEach(function(e){e.textContent=new Date().getFullYear();});</script>
  </footer>

  <!-- Bootstrap JS -->
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  
  <!-- Auth System -->
  <script src="js/auth.js"></script>
  
  <!-- Protected Pages Auth Check -->
  <script src="js/protected-pages.js"></script>
  
  <!-- Messages Script -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/email-notifications.js"></script>
  <script src="js/messages.js"></script>
  
  <!-- Footer Fix -->
  <script src="js/footer-fix.js"></script>
  
  <!-- AI Chatbot -->
  <script src="js/nav-active.js"></script>
  <script src="js/ai-chatbot.js"></script>

  <!-- Auth Guard - Redirect if not logged in -->
  <script>
    (async function() {
      const supabaseClient = window.getSupabaseClient ? window.getSupabaseClient() : 
                            (window.supabaseClient || (typeof supabase !== 'undefined' ? supabase.createClient(
                              'https://your-project.supabase.co',
                              'your-anon-key'
                            ) : null));
      
      if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session?.user) {
          // Store intended destination
          sessionStorage.setItem('redirectAfterLogin', window.location.href);
          // Redirect to login
          window.location.href = 'signin.html?redirect=messages';
        }
      }
    })();
  </script>

  <script>
    // Initialize particles
    particlesJS('particles-js', {
      particles: { number: { value: 50 }, color: { value: '#ff0088' } },
      interactivity: { events: { onhover: { enable: true, mode: 'repulse' } } }
    });

    // Auto-resize textarea
    document.getElementById('messageInput')?.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    document.getElementById('messageInput')?.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
