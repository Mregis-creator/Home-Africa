<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network - HOME AFRICA</title>

  <!-- Bootstrap CSS -->
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('images/hero-bg.jpeg') center center/cover no-repeat;
      overflow-x: hidden;
      padding-top: 80px;
      padding-bottom: 100px;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: linear-gradient(120deg, rgba(0,255,136,0.25) 0%, rgba(0,136,255,0.25) 50%, rgba(255,0,136,0.18) 100%);
      pointer-events: none;
    }

    .navbar {
      background: linear-gradient(90deg, rgba(255,0,136,0.3) 0%, rgba(0,136,255,0.3) 100%) !important;
      border-bottom: 3px solid #ff0088;
      box-shadow: 0 2px 12px rgba(255,0,136,0.2);
      position: relative;
      z-index: 1000;
    }

    .network-container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .network-card {
      background: linear-gradient(120deg, rgba(0,0,0,0.95) 60%, rgba(255,0,136,0.15) 100%);
      border: 2px solid #ff0088;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 24px 0 rgba(255,0,136,0.2);
    }

    .nav-tabs {
      border-bottom: 2px solid rgba(255,0,136,0.3);
    }

    .nav-tabs .nav-link {
      color: rgba(255,255,255,0.7);
      border: none;
      padding: 1rem 2rem;
    }

    .nav-tabs .nav-link.active {
      color: #0ff;
      background: transparent;
      border-bottom: 3px solid #0ff;
    }

    .user-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: all 0.3s;
    }

    .user-card:hover {
      border-color: #0ff;
      box-shadow: 0 4px 20px rgba(0,255,255,0.2);
    }

    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #0ff;
      margin-right: 1.5rem;
    }

    .btn-primary {
      background: linear-gradient(90deg, #0ff 0%, #8fff00 100%);
      border: none;
      color: #111;
      font-weight: bold;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(0,255,255,0.4);
    }

    .btn-outline-primary {
      border: 2px solid #0ff;
      color: #0ff;
      background: transparent;
      font-weight: bold;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
    }

    .btn-outline-primary:hover {
      background: #0ff;
      color: #111;
    }

    .search-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 24px;
      padding: 0.75rem 1.5rem;
      color: #fff;
      width: 100%;
    }

    .search-box:focus {
      background: rgba(255,255,255,0.15);
      border-color: #0ff;
      color: #fff;
      box-shadow: 0 0 0 0.2rem rgba(0,255,255,0.25);
      outline: none;
    }

    .search-box::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .stats-card {
      background: rgba(0,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #0ff;
    }

    .stat-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }

    .text-white {
      color: #fff !important;
    }

    .text-cyan {
      color: #0ff !important;
    }
  </style>
</head>
<body>
  <!-- Particles Background -->
  <div id="particles-js"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/hero-bg.jpeg" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;" />
        HOME AFRICA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="network.html">Network</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
          <li class="nav-item"><a class="nav-link" href="profile-personal.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="create-post.html"><i class="bi bi-plus-circle"></i> Create Post</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Network Container -->
  <div class="network-container">
    <!-- Stats Overview -->
    <div class="network-card">
      <div class="row text-center mb-4">
        <div class="col-md-3 mb-3">
          <div class="stats-card">
            <div class="stat-number" id="partnersCount">0</div>
            <div class="stat-label">Partners</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="stats-card">
            <div class="stat-number" id="followingCount">0</div>
            <div class="stat-label">Following</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="stats-card">
            <div class="stat-number" id="connectionRequests">0</div>
            <div class="stat-label">Requests</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="stats-card">
            <div class="stat-number" id="suggestionsCount">0</div>
            <div class="stat-label">Suggestions</div>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" 
               class="search-box" 
               id="networkSearch" 
               placeholder="Search for people or businesses..." 
               onkeyup="filterNetwork()" />
      </div>
    </div>

    <!-- Network Tabs -->
    <div class="network-card">
      <ul class="nav nav-tabs" id="networkTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="partners-tab" data-bs-toggle="tab" data-bs-target="#partners" type="button">
            <i class="bi bi-people-fill"></i> My Partners
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="following-tab" data-bs-toggle="tab" data-bs-target="#following" type="button">
            <i class="bi bi-person-check"></i> Following
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requests" type="button">
            <i class="bi bi-person-plus"></i> Connection Requests
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="suggestions-tab" data-bs-toggle="tab" data-bs-target="#suggestions" type="button">
            <i class="bi bi-compass"></i> Suggestions
          </button>
        </li>
      </ul>

      <div class="tab-content mt-4" id="networkTabContent">
        <!-- Partners Tab -->
        <div class="tab-pane fade show active" id="partners" role="tabpanel">
          <div id="partnersList">
            <!-- Partners will be loaded here -->
            <div class="text-center text-white-50 py-5">
              <i class="bi bi-people" style="font-size: 3rem;"></i>
              <p class="mt-3">No Partners yet. Start connecting!</p>
            </div>
          </div>
        </div>

        <!-- Following Tab -->
        <div class="tab-pane fade" id="following" role="tabpanel">
          <div id="followingList">
            <!-- Following will be loaded here -->
            <div class="text-center text-white-50 py-5">
              <i class="bi bi-person-check" style="font-size: 3rem;"></i>
              <p class="mt-3">You're not following anyone yet.</p>
            </div>
          </div>
        </div>

        <!-- Requests Tab -->
        <div class="tab-pane fade" id="requests" role="tabpanel">
          <div id="requestsList">
            <!-- Connection requests will be loaded here -->
            <div class="text-center text-white-50 py-5">
              <i class="bi bi-person-plus" style="font-size: 3rem;"></i>
              <p class="mt-3">No pending connection requests.</p>
            </div>
          </div>
        </div>

        <!-- Suggestions Tab -->
        <div class="tab-pane fade" id="suggestions" role="tabpanel">
          <div id="suggestionsList">
            <!-- Suggestions will be loaded here -->
            <div class="text-center text-white-50 py-5">
              <i class="bi bi-compass" style="font-size: 3rem;"></i>
              <p class="mt-3">Loading suggestions...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-light pt-4 pb-3 mt-5">
    <div class="container">
      <div class="text-center">
        <p>&copy; 2025 HOME AFRICA. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  
  <!-- Auth System -->
  <script src="js/auth.js"></script>
  
  <!-- Protected Pages Auth Check -->
  <script src="js/protected-pages.js"></script>
  
  <!-- Network Script -->
  <script src="js/network.js"></script>
  
  <!-- Footer Fix -->
  <script src="js/footer-fix.js"></script>
  
  <!-- AI Chatbot -->
  <script src="js/ai-chatbot.js"></script>

  <script>
    // Initialize particles
    particlesJS('particles-js', {
      particles: { number: { value: 50 }, color: { value: '#ff0088' } },
      interactivity: { events: { onhover: { enable: true, mode: 'repulse' } } }
    });

    // Filter network
    function filterNetwork() {
      const searchTerm = document.getElementById('networkSearch').value.toLowerCase();
      const userCards = document.querySelectorAll('.user-card');
      
      userCards.forEach(card => {
        const name = card.querySelector('.user-name')?.textContent.toLowerCase() || '';
        const title = card.querySelector('.user-title')?.textContent.toLowerCase() || '';
        
        if (name.includes(searchTerm) || title.includes(searchTerm)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
