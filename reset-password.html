<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Your Password - HOME AFRICA</title>
  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body { background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%); min-height: 100vh; color: #fff; }
    .card-glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(0,255,255,0.2); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-glass h5 { color: #0ff; display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    .form-control { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,255,0.3); color: #fff; }
    .form-control:focus { background: rgba(255,255,255,0.08); border-color: #0ff; color: #fff; box-shadow: none; }
    .form-label { color: rgba(255,255,255,0.75); font-size: .85rem; }
    .save-btn { background: linear-gradient(90deg,#0ff,#8fff00); color:#111; border:none; font-weight:700; padding:.7rem 2.2rem; border-radius:10px; width:100%; }
    .save-btn:disabled { opacity:.55; }
    .muted { color: rgba(255,255,255,.5); font-size:.8rem; }
  </style>
</head>
<body>
  <div data-ha-nav data-active=""></div>

  <div class="container py-5" style="max-width: 520px;">
    <h2 class="fw-bold mb-2"><i class="bi bi-key-fill" style="color:#0ff;"></i> Reset Your Password</h2>
    <p class="muted" id="introText">Checking your reset link…</p>

    <!-- Shown while the recovery session is being established -->
    <div class="card-glass" id="checkingCard">
      <div class="d-flex align-items-center gap-3">
        <div class="spinner-border" role="status" style="color:#0ff; width:1.4rem; height:1.4rem;"></div>
        <span>Verifying your reset link…</span>
      </div>
    </div>

    <!-- Shown when the link is missing, invalid, or expired -->
    <div class="card-glass" id="invalidCard" style="display:none;">
      <h5><i class="bi bi-exclamation-triangle"></i> Link invalid or expired</h5>
      <p class="mb-3">This password reset link is no longer valid. Reset links expire, and each one can only be used once.</p>
      <a href="signin.html" class="btn btn-outline-info">Request a new reset link</a>
    </div>

    <!-- The actual reset form -->
    <div class="card-glass" id="formCard" style="display:none;">
      <form id="passwordResetForm" novalidate>
        <div class="mb-3">
          <label for="resetPassword" class="form-label">New password</label>
          <input type="password" class="form-control" id="resetPassword"
                 placeholder="Enter your new password" required minlength="6" autocomplete="new-password" />
        </div>

        <div class="mb-3">
          <label for="resetPasswordConfirm" class="form-label">Confirm new password</label>
          <input type="password" class="form-control" id="resetPasswordConfirm"
                 placeholder="Confirm your new password" required minlength="6" autocomplete="new-password" />
        </div>

        <div id="resetError" class="alert alert-danger" style="display:none; background: rgba(220,53,69,0.2); border: 1px solid #dc3545; color: #fff;"></div>
        <div id="resetSuccess" class="alert alert-success" style="display:none; background: rgba(0,255,136,0.2); border: 1px solid #00c853; color: #fff;"></div>

        <button type="submit" class="save-btn" id="resetSubmit">Reset password</button>
      </form>

      <div class="text-center mt-3">
        <a href="signin.html" class="muted">Back to Log In</a>
      </div>
    </div>
  </div>

  <div data-ha-footer="minimal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let sb = null;

    // Same polling helper used by profile-complete.html — the client is built
    // asynchronously by /api/supabase-config, so neither global exists at parse time.
    async function waitForClient(tries = 30) {
      while (tries-- > 0) {
        const c = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
        if (c) return c;
        await new Promise(r => setTimeout(r, 100));
      }
      return null;
    }

    function show(which) {
      document.getElementById('checkingCard').style.display = which === 'checking' ? 'block' : 'none';
      document.getElementById('invalidCard').style.display  = which === 'invalid'  ? 'block' : 'none';
      document.getElementById('formCard').style.display     = which === 'form'     ? 'block' : 'none';
      document.getElementById('introText').textContent =
        which === 'form' ? 'Choose a new password for your HOME AFRICA account.'
        : which === 'invalid' ? 'We could not verify this reset link.'
        : 'Checking your reset link…';
    }

    /**
     * Establish the recovery session.
     *
     * Supabase emits the recovery token in one of three shapes depending on the
     * client flowType and the version of the email template, so handle all three:
     *   1. implicit — #access_token=…&type=recovery  (consumed automatically by
     *      detectSessionInUrl, which may fire PASSWORD_RECOVERY before we listen)
     *   2. PKCE     — ?code=…                        → exchangeCodeForSession
     *   3. newer    — ?token_hash=…&type=recovery    → verifyOtp
     *
     * Because case 1 can complete before this script attaches its listener, we
     * both subscribe to onAuthStateChange AND poll getSession(). A session
     * existing is sufficient — we never gate on catching the event itself.
     */
    async function establishRecoverySession() {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const tokenHash = params.get('token_hash');

      if (code) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) console.warn('exchangeCodeForSession:', error.message);
      } else if (tokenHash) {
        const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
        if (error) console.warn('verifyOtp:', error.message);
      }

      // Poll for up to ~3s to cover the implicit flow resolving in the background.
      for (let i = 0; i < 30; i++) {
        const { data: { session } } = await sb.auth.getSession();
        if (session) return session;
        await new Promise(r => setTimeout(r, 100));
      }
      return null;
    }

    async function init() {
      sb = await waitForClient();
      if (!sb) {
        show('invalid');
        document.querySelector('#invalidCard p').textContent =
          'Could not connect to the server. Please refresh and try again.';
        return;
      }

      // Attach first so a late-firing PASSWORD_RECOVERY is never missed.
      sb.auth.onAuthStateChange((event, session) => {
        if (session && document.getElementById('formCard').style.display === 'none'
            && document.getElementById('resetSuccess').style.display === 'none') {
          show('form');
        }
      });

      const session = await establishRecoverySession();
      show(session ? 'form' : 'invalid');
    }

    document.getElementById('passwordResetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('resetError');
      const successDiv = document.getElementById('resetSuccess');
      const submitBtn = document.getElementById('resetSubmit');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      const newPassword = document.getElementById('resetPassword').value;
      const confirmPassword = document.getElementById('resetPasswordConfirm').value;

      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'block';
        return;
      }
      if (newPassword.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters.';
        errorDiv.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';

      try {
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) throw error;

        // Strip the recovery token from the URL so it cannot be re-read or shared.
        history.replaceState({}, '', location.pathname);

        successDiv.innerHTML =
          '<i class="bi bi-check-circle"></i> <strong>Password updated.</strong> Signing you out — log in with your new password…';
        successDiv.style.display = 'block';

        await sb.auth.signOut();
        setTimeout(() => { window.location.href = 'signin.html?reset=success'; }, 1800);
      } catch (err) {
        errorDiv.textContent = err.message || 'Could not reset your password. Please request a new link.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });

    init();
  </script>
</body>
</html>
