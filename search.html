<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - HOME AFRICA</title>
  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link rel="apple-touch-icon" href="homeafricabanneralternative_III.png" />
  <meta name="description" content="HOME AFRICA � Rwanda's trusted real estate and lifestyle platform. Browse verified apartments, land, and cars, and connect instantly with sellers." />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css" />
    
    <style>
        .search-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .search-header {
            background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(255,0,136,0.2) 100%);
            border: 2px solid #ff0088;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 24px rgba(255,0,136,0.3);
        }
        
        .search-input-group {
            position: relative;
        }
        
        .search-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(0,255,255,0.3);
            color: #fff;
            padding: 1rem 3.5rem 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
        }
        
        .search-input:focus {
            background: rgba(255,255,255,0.15);
            border-color: #0ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        
        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(90deg, #ff0088 0%, #00ffff 100%);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
        }
        
        .search-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        
        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,255,255,0.3);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, #ff0088 0%, #00ffff 100%);
            border-color: transparent;
        }
        
        .results-section {
            margin-top: 2rem;
        }
        
        .result-card {
            background: linear-gradient(120deg, rgba(0,0,0,0.95) 60%, rgba(255,0,136,0.15) 100%);
            border: 2px solid #ff0088;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255,0,136,0.4);
            border-color: #0ff;
        }
        
        .result-type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .badge-listing {
            background: linear-gradient(90deg, #ff0088 0%, #00ffff 100%);
            color: #000;
        }
        
        .badge-user {
            background: linear-gradient(90deg, #00ffff 0%, #ff0088 100%);
            color: #000;
        }
        
        .badge-post {
            background: linear-gradient(90deg, #28a745 0%, #20c997 100%);
            color: #fff;
        }
        
        .result-title {
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .result-description {
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.5rem;
        }
        
        .result-meta {
            display: flex;
            gap: 1rem;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.5);
        }
        
        .no-results i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: rgba(255,0,136,0.5);
        }
        
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: #0ff;
        }
        
        .results-stats {
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-house-heart"></i> HOME AFRICA
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cars.html">Cars</a></li>
                    <li class="nav-item"><a class="nav-link" href="apartment.html">Apartments</a></li>
                    <li class="nav-item"><a class="nav-link" href="land.html">Land</a></li>
                    <li class="nav-item"><a class="nav-link" href="post.html">Post</a></li>
                    <li class="nav-item"><a class="nav-link" href="signin.html">Log In</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
                    <li class="nav-item"><a class="nav-link" href="network.html">Network</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html"><i class="bi bi-search"></i> Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="askRejoLink"><i class="bi bi-robot"></i> Ask Rejo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid" style="margin-top: 80px; min-height: calc(100vh - 80px);">
        <div class="search-container">
            <!-- Search Header -->
            <div class="search-header">
                <h2 class="text-white mb-4"><i class="bi bi-search"></i> Search HOME AFRICA</h2>
                
                <div class="search-input-group">
                    <input 
                        type="text" 
                        class="form-control search-input" 
                        id="searchInput" 
                        placeholder="Search for listings, users, posts..."
                        autocomplete="off"
                    >
                    <button class="btn search-btn" id="searchBtn">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
                
                <div class="search-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="listings">Listings</button>
                    <button class="filter-btn" data-filter="users">Users</button>
                    <button class="filter-btn" data-filter="posts">Posts</button>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <div id="resultsStats" class="results-stats" style="display: none;"></div>
                <div id="resultsContainer">
                    <div class="no-results">
                        <i class="bi bi-search"></i>
                        <h4>Start searching...</h4>
                        <p>Enter a keyword above to search for listings, users, or posts</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div data-ha-footer="minimal"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/components.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/search.js"></script>
    <script src="js/nav-active.js"></script>
    <script src="js/ai-chatbot.js"></script>
</body>
</html>
