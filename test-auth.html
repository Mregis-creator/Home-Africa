<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Authentication | HOME AFRICA</title>
  <link rel="icon" type="image/png" href="homeafricabanneralternative_III.png" />
  <link rel="apple-touch-icon" href="homeafricabanneralternative_III.png" />
  <meta name="description" content="HOME AFRICA � Rwanda's trusted real estate and lifestyle platform. Browse verified apartments, land, and cars, and connect instantly with sellers." />
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }
    .test-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      margin-bottom: 2rem;
    }
    .test-result {
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .test-result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .test-result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .test-result.info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
    .step-number {
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #667eea;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="test-card">
          <h1 class="mb-4"><i class="bi bi-shield-check"></i> Authentication Test Page</h1>
          
          <!-- Step 1: Check Firebase Config -->
          <div class="mb-4">
            <h3><span class="step-number">1</span>Firebase Configuration</h3>
            <button class="btn btn-primary" onclick="testFirebaseConfig()">Test Firebase Config</button>
            <div id="configResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Step 2: Check Firebase Auth -->
          <div class="mb-4">
            <h3><span class="step-number">2</span>Firebase Authentication Status</h3>
            <button class="btn btn-primary" onclick="testFirebaseAuth()">Check Auth Status</button>
            <div id="authResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Step 3: Test Registration -->
          <div class="mb-4">
            <h3><span class="step-number">3</span>Test Registration</h3>
            <form id="testRegistrationForm" onsubmit="testRegistration(event)">
              <div class="mb-3">
                <label class="form-label">Test Email</label>
                <input type="email" class="form-control" id="testEmail" value="test@example.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Test Password</label>
                <input type="password" class="form-control" id="testPassword" value="test123456" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Test Name</label>
                <input type="text" class="form-control" id="testName" value="Test Merchant" required />
              </div>
              <button type="submit" class="btn btn-success">Test Registration</button>
            </form>
            <div id="registrationResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Step 4: Test Login -->
          <div class="mb-4">
            <h3><span class="step-number">4</span>Test Login</h3>
            <form id="testLoginForm" onsubmit="testLogin(event)">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" value="test@example.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" value="test123456" required />
              </div>
              <button type="submit" class="btn btn-primary">Test Login</button>
            </form>
            <div id="loginResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Step 5: Test Merchant Verification -->
          <div class="mb-4">
            <h3><span class="step-number">5</span>Test Merchant Verification</h3>
            <button class="btn btn-info" onclick="testMerchantVerification()">Check Merchant Status</button>
            <div id="merchantResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Step 6: Current Auth State -->
          <div class="mb-4">
            <h3><span class="step-number">6</span>Current Authentication State</h3>
            <button class="btn btn-secondary" onclick="showAuthState()">Show Current State</button>
            <div id="authStateResult" class="test-result" style="display: none;"></div>
          </div>

          <!-- Quick Links -->
          <div class="mt-4 p-3 bg-light rounded">
            <h5>Quick Links:</h5>
            <a href="signup.html" class="btn btn-outline-primary me-2">Go to Signup</a>
            <a href="admin.html" class="btn btn-outline-success me-2">Go to Admin Panel</a>
            <a href="index.html" class="btn btn-outline-secondary">Go to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBJ2Ak6jpQxx87pAXzZO84Qpv9mk6QumJ4",
      authDomain: "home-africa-90018.firebaseapp.com",
      projectId: "home-africa-90018",
      storageBucket: "home-africa-90018.appspot.com",
      messagingSenderId: "38483277216",
      appId: "1:38483277216:web:945484e33e73d92fbc60c5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    // Test Firebase Config
    function testFirebaseConfig() {
      const resultDiv = document.getElementById('configResult');
      try {
        if (firebase.apps.length > 0) {
          resultDiv.innerHTML = '<strong>✅ Success:</strong> Firebase is initialized correctly.<br>Project ID: ' + firebaseConfig.projectId;
          resultDiv.className = 'test-result success';
        } else {
          throw new Error('Firebase not initialized');
        }
      } catch (error) {
        resultDiv.innerHTML = '<strong>❌ Error:</strong> ' + error.message;
        resultDiv.className = 'test-result error';
      }
      resultDiv.style.display = 'block';
    }

    // Test Firebase Auth
    function testFirebaseAuth() {
      const resultDiv = document.getElementById('authResult');
      try {
        if (auth) {
          const currentUser = auth.currentUser;
          if (currentUser) {
            resultDiv.innerHTML = '<strong>✅ Authenticated:</strong> User is logged in.<br>Email: ' + currentUser.email + '<br>UID: ' + currentUser.uid;
            resultDiv.className = 'test-result success';
          } else {
            resultDiv.innerHTML = '<strong>ℹ️ Info:</strong> No user currently authenticated.';
            resultDiv.className = 'test-result info';
          }
        } else {
          throw new Error('Firebase Auth not available');
        }
      } catch (error) {
        resultDiv.innerHTML = '<strong>❌ Error:</strong> ' + error.message;
        resultDiv.className = 'test-result error';
      }
      resultDiv.style.display = 'block';
    }

    // Test Registration
    async function testRegistration(event) {
      event.preventDefault();
      const resultDiv = document.getElementById('registrationResult');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<strong>⏳ Processing...</strong> Creating account...';
      resultDiv.className = 'test-result info';

      const email = document.getElementById('testEmail').value;
      const password = document.getElementById('testPassword').value;
      const name = document.getElementById('testName').value;

      try {
        // Create Firebase Auth user
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Create merchant document
        const merchantData = {
          merchantName: name,
          merchantEmail: email,
          merchantContact: email,
          email: email,
          categories: ['apartment', 'car'],
          verified: false,
          rating: 0,
          totalReviews: 0,
          totalListings: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          userId: user.uid
        };

        await db.collection('merchants').doc(user.uid).set(merchantData);

        resultDiv.innerHTML = '<strong>✅ Success:</strong> Account created!<br>User ID: ' + user.uid + '<br>Email: ' + user.email + '<br>Merchant document created in Firestore.';
        resultDiv.className = 'test-result success';
      } catch (error) {
        let errorMsg = error.message;
        if (error.code === 'auth/email-already-in-use') {
          errorMsg = 'Email already registered. Try logging in instead.';
        } else if (error.code === 'auth/operation-not-allowed') {
          errorMsg = '⚠️ Email/Password authentication not enabled in Firebase Console! Go to Firebase Console → Authentication → Sign-in method → Enable Email/Password';
        }
        resultDiv.innerHTML = '<strong>❌ Error:</strong> ' + errorMsg + '<br>Code: ' + (error.code || 'unknown');
        resultDiv.className = 'test-result error';
      }
    }

    // Test Login
    async function testLogin(event) {
      event.preventDefault();
      const resultDiv = document.getElementById('loginResult');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<strong>⏳ Processing...</strong> Logging in...';
      resultDiv.className = 'test-result info';

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Check if merchant exists
        const merchantDoc = await db.collection('merchants').doc(user.uid).get();
        
        if (merchantDoc.exists) {
          resultDiv.innerHTML = '<strong>✅ Success:</strong> Login successful!<br>Email: ' + user.email + '<br>Merchant: ' + merchantDoc.data().merchantName + '<br>✅ Merchant verified - Can access admin panel!';
          resultDiv.className = 'test-result success';
        } else {
          resultDiv.innerHTML = '<strong>⚠️ Warning:</strong> User authenticated but NOT a registered merchant.<br>Email: ' + user.email + '<br>❌ Cannot access admin panel.';
          resultDiv.className = 'test-result error';
        }
      } catch (error) {
        let errorMsg = error.message;
        if (error.code === 'auth/user-not-found') {
          errorMsg = 'User not found. Please register first.';
        } else if (error.code === 'auth/wrong-password') {
          errorMsg = 'Incorrect password.';
        } else if (error.code === 'auth/operation-not-allowed') {
          errorMsg = '⚠️ Email/Password authentication not enabled in Firebase Console!';
        }
        resultDiv.innerHTML = '<strong>❌ Error:</strong> ' + errorMsg + '<br>Code: ' + (error.code || 'unknown');
        resultDiv.className = 'test-result error';
      }
    }

    // Test Merchant Verification
    async function testMerchantVerification() {
      const resultDiv = document.getElementById('merchantResult');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<strong>⏳ Processing...</strong> Checking merchant status...';
      resultDiv.className = 'test-result info';

      try {
        const user = auth.currentUser;
        if (!user) {
          resultDiv.innerHTML = '<strong>ℹ️ Info:</strong> No user logged in. Please login first.';
          resultDiv.className = 'test-result info';
          return;
        }

        // Check by userId
        const merchantDoc = await db.collection('merchants').doc(user.uid).get();
        
        if (merchantDoc.exists) {
          const merchant = merchantDoc.data();
          resultDiv.innerHTML = '<strong>✅ Merchant Found:</strong><br>Name: ' + merchant.merchantName + '<br>Email: ' + merchant.merchantEmail + '<br>Categories: ' + (merchant.categories || []).join(', ') + '<br>Verified: ' + (merchant.verified ? 'Yes' : 'No') + '<br>✅ Can access admin panel!';
          resultDiv.className = 'test-result success';
        } else {
          // Check by email
          const emailSnapshot = await db.collection('merchants').where('merchantEmail', '==', user.email).limit(1).get();
          if (!emailSnapshot.empty) {
            const merchant = emailSnapshot.docs[0].data();
            resultDiv.innerHTML = '<strong>✅ Merchant Found (by email):</strong><br>Name: ' + merchant.merchantName + '<br>Email: ' + merchant.merchantEmail;
            resultDiv.className = 'test-result success';
          } else {
            resultDiv.innerHTML = '<strong>❌ Not a Merchant:</strong> User is authenticated but not registered as a merchant.<br>Email: ' + user.email + '<br>❌ Cannot access admin panel.';
            resultDiv.className = 'test-result error';
          }
        }
      } catch (error) {
        resultDiv.innerHTML = '<strong>❌ Error:</strong> ' + error.message;
        resultDiv.className = 'test-result error';
      }
    }

    // Show Auth State
    function showAuthState() {
      const resultDiv = document.getElementById('authStateResult');
      const user = auth.currentUser;
      
      if (user) {
        resultDiv.innerHTML = '<strong>Current User:</strong><br>UID: ' + user.uid + '<br>Email: ' + user.email + '<br>Email Verified: ' + (user.emailVerified ? 'Yes' : 'No') + '<br>Display Name: ' + (user.displayName || 'Not set');
        resultDiv.className = 'test-result success';
      } else {
        resultDiv.innerHTML = '<strong>No User Logged In</strong>';
        resultDiv.className = 'test-result info';
      }
      resultDiv.style.display = 'block';
    }

    // Listen to auth state changes
    auth.onAuthStateChanged(function(user) {
      console.log('Auth state changed:', user ? user.email : 'No user');
    });
  </script>
</body>
</html>
