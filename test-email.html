<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Test - HOME AFRICA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #0a1929;
      color: #fff;
    }
    h1 {
      color: #00e6d8;
      text-align: center;
    }
    button {
      background: linear-gradient(90deg, #00e6d8 10%, #00c853 90%);
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin: 10px 5px;
      display: inline-block;
    }
    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    #result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
    }
    .success {
      background: rgba(0, 200, 83, 0.2);
      color: #00c853;
      border: 1px solid #00c853;
    }
    .error {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    .info {
      background: rgba(0, 230, 216, 0.2);
      color: #00e6d8;
      border: 1px solid #00e6d8;
    }
    .buttons {
      text-align: center;
      margin: 30px 0;
    }
  </style>
</head>
<body>
  <h1>🏠 HOME AFRICA Email System Test</h1>
  
  <div class="buttons">
    <button onclick="testWelcome()">1️⃣ Send Welcome Email</button>
    <button onclick="testLead()">2️⃣ Send Lead Notification</button>
    <button onclick="testPayment()">3️⃣ Send Payment Confirmation</button>
  </div>

  <div id="result"></div>

  <script src="js/email-service.js"></script>
  <script>
    function showResult(message, type) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = type;
      resultDiv.innerHTML = message;
    }

    // Test 1: Welcome Email
    async function testWelcome() {
      showResult('⏳ Sending welcome email...', 'info');
      
      const result = await emailService.sendWelcomeEmail(
        'regismuhakwa@gmail.com',
        'Test User',
        'merchant'
      );
      
      if (result.success) {
        showResult('✅ Welcome email sent! Check your inbox at regismuhakwa@gmail.com', 'success');
      } else {
        showResult('❌ Failed: ' + result.error, 'error');
      }
    }

    // Test 2: Lead Notification
    async function testLead() {
      showResult('⏳ Sending lead notification...', 'info');
      
      const result = await emailService.sendLeadNotification(
        'regismuhakwa@gmail.com',
        'Test Merchant',
        {
          name: 'John Doe',
          email: 'lead@example.com',
          phone: '+250788123456',
          message: 'Is this apartment still available? I would like to schedule a viewing.',
          productTitle: '3BR Modern Apartment in Kacyiru',
          productType: 'apartment',
          productUrl: 'https://home-africa.com/apartment/123'
        }
      );
      
      if (result.success) {
        showResult('✅ Lead notification sent! Check your inbox.', 'success');
      } else {
        showResult('❌ Failed: ' + result.error, 'error');
      }
    }

    // Test 3: Payment Confirmation
    async function testPayment() {
      showResult('⏳ Sending payment confirmation...', 'info');
      
      const result = await emailService.sendPaymentConfirmation(
        'regismuhakwa@gmail.com',
        'Test User',
        {
          amount: 75000,
          currency: 'RWF',
          paymentMethod: 'momo_mtn',
          reference: 'PAY-TEST-123456',
          status: 'confirmed',
          description: 'Monthly Subscription - Premium Plan',
          productTitle: 'Premium Subscription'
        }
      );
      
      if (result.success) {
        showResult('✅ Payment confirmation sent! Check your inbox.', 'success');
      } else {
        showResult('❌ Failed: ' + result.error, 'error');
      }
    }
  </script>
</body>
</html>
